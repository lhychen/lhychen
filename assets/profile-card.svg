<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280">
  <defs>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6EC7"/>
      <stop offset="50%" stop-color="#7B68EE"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundClip">
      <rect x="4" y="4" width="552" height="272" rx="12"/>
    </clipPath>
  </defs>

  <!-- Outer glow border -->
  <rect x="2" y="2" width="556" height="276" rx="14" fill="none" stroke="url(#borderGlow)" stroke-width="2" filter="url(#neonGlow)" opacity="0.8"/>

  <!-- Background -->
  <rect x="4" y="4" width="552" height="272" rx="12" fill="#0D1117"/>

  <!-- Title bar -->
  <rect x="4" y="4" width="552" height="36" rx="12" fill="#161B22"/>
  <rect x="4" y="28" width="552" height="12" fill="#161B22"/>

  <!-- Traffic light dots -->
  <circle cx="24" cy="22" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="22" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="22" r="6" fill="#27C93F"/>

  <!-- Title text -->
  <text x="280" y="27" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', monospace" font-size="14" fill="#FF6EC7" font-weight="bold">PROFILE://INIT</text>

  <!-- Blinking cursor dot in title -->
  <circle cx="390" cy="22" r="3" fill="#00FF41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Separator line -->
  <line x1="16" y1="40" x2="544" y2="40" stroke="#FF6EC7" stroke-width="1" opacity="0.3"/>

  <!-- Content -->
  <text font-family="'Fira Code', 'Cascadia Code', 'Courier New', monospace" font-size="15">

    <!-- Command prompt line -->
    <tspan x="24" dy="68" fill="#7B68EE">~/lhychen</tspan>
    <tspan fill="#00FFFF"> $</tspan>
    <tspan fill="#E6EDF3"> whoami</tspan>

    <!-- Output lines -->
    <tspan x="24" dy="30" fill="#8B949E">┌─ </tspan>
    <tspan fill="#FF6EC7">user</tspan>
    <tspan fill="#8B949E"> ─────────────────────────────────┐</tspan>

    <tspan x="24" dy="24" fill="#8B949E">│</tspan>
    <tspan fill="#00FFFF">  name</tspan>
    <tspan fill="#8B949E">    lhychen</tspan>
    <tspan fill="#8B949E">                         │</tspan>

    <tspan x="24" dy="24" fill="#8B949E">│</tspan>
    <tspan fill="#00FFFF">  role</tspan>
    <tspan fill="#8B949E">    Developer / Creator</tspan>
    <tspan fill="#8B949E">              │</tspan>

    <tspan x="24" dy="24" fill="#8B949E">│</tspan>
    <tspan fill="#00FFFF">  lang</tspan>
    <tspan fill="#8B949E">    Python / C++ / Java</tspan>
    <tspan fill="#8B949E">             │</tspan>

    <tspan x="24" dy="24" fill="#8B949E">│</tspan>
    <tspan fill="#00FFFF">  shell</tspan>
    <tspan fill="#8B949E">   Windows + Git Bash</tspan>
    <tspan fill="#8B949E">             │</tspan>

    <tspan x="24" dy="24" fill="#8B949E">│</tspan>
    <tspan fill="#00FFFF">  status</tspan>
    <tspan fill="#27C93F">  ● ONLINE</tspan>
    <tspan fill="#8B949E">                     │</tspan>

    <tspan x="24" dy="24" fill="#8B949E">└──────────────────────────────────────┘</tspan>
  </text>

  <!-- Scanline effect -->
  <rect x="4" y="4" width="552" height="272" rx="12" fill="url(#scanlines)" opacity="0.03"/>

  <!-- Scanline pattern -->
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="white"/>
    </pattern>
  </defs>
</svg>
