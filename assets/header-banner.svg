<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="60%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="gridColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6EC7" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FF6EC7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7B68EE" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6EC7"/>
      <stop offset="100%" stop-color="#7B68EE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="bottomFade">
      <rect x="0" y="0" width="1200" height="260"/>
    </clipPath>
  </defs>

  <!-- Background sky -->
  <rect width="1200" height="260" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="30" r="1.5"/>
    <circle cx="200" cy="50" r="1"/>
    <circle cx="350" cy="20" r="1.2"/>
    <circle cx="500" cy="45" r="1"/>
    <circle cx="680" cy="15" r="1.5"/>
    <circle cx="820" cy="35" r="1"/>
    <circle cx="950" cy="25" r="1.3"/>
    <circle cx="1100" cy="40" r="1"/>
    <circle cx="150" cy="70" r="0.8"/>
    <circle cx="420" cy="60" r="1"/>
    <circle cx="750" cy="55" r="0.8"/>
    <circle cx="1050" cy="65" r="1.2"/>
  </g>

  <!-- Neon sun/moon -->
  <circle cx="600" cy="100" r="50" fill="url(#sunGrad)" opacity="0.2" filter="url(#softGlow)"/>
  <circle cx="600" cy="100" r="35" fill="none" stroke="#FF6EC7" stroke-width="1.5" opacity="0.6"/>
  <circle cx="600" cy="100" r="28" fill="none" stroke="#7B68EE" stroke-width="1" opacity="0.4"/>
  <!-- Horizontal lines through sun -->
  <g stroke="#0D1117" stroke-width="3">
    <line x1="565" y1="90" x2="635" y2="90"/>
    <line x1="568" y1="100" x2="632" y2="100"/>
    <line x1="572" y1="110" x2="628" y2="110"/>
    <line x1="578" y1="120" x2="622" y2="120"/>
  </g>

  <!-- Horizon glow -->
  <ellipse cx="600" cy="130" rx="600" ry="20" fill="#FF6EC7" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Perspective grid -->
  <g stroke="url(#gridColor)" stroke-width="1" fill="none">
    <!-- Horizontal lines -->
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="215" x2="1200" y2="215"/>
    <line x1="0" y1="228" x2="1200" y2="228"/>
    <line x1="0" y1="238" x2="1200" y2="238"/>
    <line x1="0" y1="246" x2="1200" y2="246"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <!-- Vertical perspective lines from center -->
    <line x1="600" y1="130" x2="0" y2="260"/>
    <line x1="600" y1="130" x2="100" y2="260"/>
    <line x1="600" y1="130" x2="200" y2="260"/>
    <line x1="600" y1="130" x2="300" y2="260"/>
    <line x1="600" y1="130" x2="400" y2="260"/>
    <line x1="600" y1="130" x2="500" y2="260"/>
    <line x1="600" y1="130" x2="600" y2="260"/>
    <line x1="600" y1="130" x2="700" y2="260"/>
    <line x1="600" y1="130" x2="800" y2="260"/>
    <line x1="600" y1="130" x2="900" y2="260"/>
    <line x1="600" y1="130" x2="1000" y2="260"/>
    <line x1="600" y1="130" x2="1100" y2="260"/>
    <line x1="600" y1="130" x2="1200" y2="260"/>
  </g>

  <!-- City silhouette left -->
  <g fill="#0a0a1a">
    <rect x="50" y="110" width="30" height="30"/>
    <rect x="85" y="95" width="20" height="45"/>
    <rect x="110" y="105" width="35" height="35"/>
    <rect x="150" y="85" width="15" height="55"/>
    <rect x="170" y="100" width="25" height="40"/>
    <rect x="200" y="110" width="20" height="30"/>
    <rect x="225" y="90" width="18" height="50"/>
  </g>
  <!-- City lights left -->
  <g fill="#FF6EC7" opacity="0.6">
    <rect x="55" y="115" width="3" height="3"/>
    <rect x="62" y="120" width="3" height="3"/>
    <rect x="90" y="100" width="3" height="3"/>
    <rect x="120" y="110" width="3" height="3"/>
    <rect x="130" y="115" width="3" height="3"/>
    <rect x="155" y="90" width="3" height="3"/>
    <rect x="178" y="105" width="3" height="3"/>
    <rect x="230" y="95" width="3" height="3"/>
  </g>

  <!-- City silhouette right -->
  <g fill="#0a0a1a">
    <rect x="900" y="100" width="25" height="40"/>
    <rect x="930" y="90" width="20" height="50"/>
    <rect x="955" y="105" width="30" height="35"/>
    <rect x="990" y="80" width="18" height="60"/>
    <rect x="1015" y="95" width="25" height="45"/>
    <rect x="1045" y="105" width="20" height="35"/>
    <rect x="1070" y="88" width="22" height="52"/>
    <rect x="1100" y="100" width="30" height="40"/>
    <rect x="1135" y="110" width="15" height="30"/>
  </g>
  <!-- City lights right -->
  <g fill="#7B68EE" opacity="0.6">
    <rect x="905" y="105" width="3" height="3"/>
    <rect x="915" y="110" width="3" height="3"/>
    <rect x="935" y="95" width="3" height="3"/>
    <rect x="960" y="110" width="3" height="3"/>
    <rect x="995" y="85" width="3" height="3"/>
    <rect x="1020" y="100" width="3" height="3"/>
    <rect x="1075" y="92" width="3" height="3"/>
    <rect x="1110" y="105" width="3" height="3"/>
  </g>

  <!-- Bottom fade to background -->
  <rect y="240" width="1200" height="20" fill="#0D1117" opacity="0.8"/>
</svg>
