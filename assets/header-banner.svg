<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="gridColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6EC7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF6EC7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7B68EE" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FF6EC7"/>
      <stop offset="40%" stop-color="#c850c0"/>
      <stop offset="100%" stop-color="#4a1a6e"/>
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6EC7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffb6e6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF6EC7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#f5d0d8"/>
      <stop offset="100%" stop-color="#e8b0c0"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#00cccc" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FF6EC7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7B68EE" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="visorShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1e1e30"/>
      <stop offset="100%" stop-color="#10101e"/>
    </linearGradient>
    <linearGradient id="jacketHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a40" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1e1e30"/>
      <stop offset="100%" stop-color="#2a2a40" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="bootGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#0a0a15"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hairGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background sky -->
  <rect width="1200" height="420" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="20" r="1.5"/><circle cx="180" cy="40" r="1"/>
    <circle cx="320" cy="15" r="1.2"/><circle cx="450" cy="35" r="1"/>
    <circle cx="580" cy="10" r="1.5"/><circle cx="720" cy="28" r="1"/>
    <circle cx="860" cy="18" r="1.3"/><circle cx="1000" cy="32" r="1"/>
    <circle cx="1140" cy="22" r="1.1"/><circle cx="100" cy="55" r="0.8"/>
    <circle cx="260" cy="48" r="1"/><circle cx="520" cy="52" r="0.8"/>
    <circle cx="780" cy="45" r="1.2"/><circle cx="950" cy="58" r="0.7"/>
    <circle cx="1080" cy="42" r="0.9"/><circle cx="40" cy="70" r="1"/>
    <circle cx="400" cy="65" r="0.6"/><circle cx="660" cy="60" r="0.9"/>
  </g>

  <!-- Neon sun behind girl -->
  <circle cx="350" cy="140" r="80" fill="#FF6EC7" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="350" cy="140" r="55" fill="none" stroke="#FF6EC7" stroke-width="2" opacity="0.35"/>
  <circle cx="350" cy="140" r="44" fill="none" stroke="#7B68EE" stroke-width="1.5" opacity="0.25"/>
  <!-- Sun horizontal cuts -->
  <g stroke="#050510" stroke-width="4">
    <line x1="295" y1="125" x2="405" y2="125"/>
    <line x1="298" y1="138" x2="402" y2="138"/>
    <line x1="303" y1="151" x2="397" y2="151"/>
    <line x1="312" y1="164" x2="388" y2="164"/>
  </g>

  <!-- City silhouette LEFT -->
  <g fill="#08080f">
    <rect x="20" y="120" width="40" height="50"/><rect x="65" y="100" width="25" height="70"/>
    <rect x="95" y="115" width="45" height="55"/><rect x="145" y="90" width="20" height="80"/>
    <rect x="170" y="105" width="30" height="65"/><rect x="205" y="120" width="25" height="50"/>
    <rect x="235" y="95" width="22" height="75"/><rect x="262" y="110" width="18" height="60"/>
    <rect x="285" y="100" width="28" height="70"/><rect x="318" y="125" width="20" height="45"/>
  </g>
  <g fill="#FF6EC7" opacity="0.5">
    <rect x="28" y="128" width="4" height="4"/><rect x="45" y="135" width="4" height="4"/>
    <rect x="72" y="108" width="4" height="4"/><rect x="105" y="122" width="4" height="4"/>
    <rect x="125" y="130" width="4" height="4"/><rect x="152" y="96" width="4" height="4"/>
    <rect x="180" y="112" width="4" height="4"/><rect x="242" y="100" width="4" height="4"/>
    <rect x="295" y="108" width="4" height="4"/>
  </g>

  <!-- City silhouette RIGHT -->
  <g fill="#08080f">
    <rect x="750" y="105" width="30" height="60"/><rect x="785" y="90" width="25" height="75"/>
    <rect x="815" y="110" width="40" height="55"/><rect x="860" y="80" width="22" height="85"/>
    <rect x="887" y="95" width="30" height="70"/><rect x="922" y="108" width="25" height="57"/>
    <rect x="952" y="88" width="28" height="77"/><rect x="985" y="100" width="35" height="65"/>
    <rect x="1025" y="112" width="20" height="53"/><rect x="1050" y="95" width="28" height="70"/>
    <rect x="1083" y="105" width="22" height="60"/><rect x="1110" y="90" width="30" height="75"/>
    <rect x="1145" y="110" width="25" height="55"/>
  </g>
  <g fill="#7B68EE" opacity="0.5">
    <rect x="758" y="112" width="4" height="4"/><rect x="795" y="96" width="4" height="4"/>
    <rect x="825" y="118" width="4" height="4"/><rect x="868" y="86" width="4" height="4"/>
    <rect x="895" y="102" width="4" height="4"/><rect x="960" y="94" width="4" height="4"/>
    <rect x="995" y="108" width="4" height="4"/><rect x="1058" y="100" width="4" height="4"/>
    <rect x="1095" y="112" width="4" height="4"/><rect x="1152" y="118" width="4" height="4"/>
  </g>

  <!-- ========== CYBERPUNK GIRL (LARGER, CENTERED) ========== -->
  <g transform="translate(280, 30)">

    <!-- ===== HAIR BACK (long flowing) ===== -->
    <path d="M160,50 C130,100 100,200 90,310 C85,350 80,370 70,385
             Q110,378 140,340 C150,310 155,260 158,200
             C170,260 175,310 178,340 Q195,378 230,385
             C220,370 215,350 210,310 C200,200 175,100 160,50Z"
          fill="url(#hairGrad)" opacity="0.55" filter="url(#hairGlow)"/>

    <!-- Hair back strands -->
    <path d="M90,310 C88,340 84,360 78,380 C90,372 98,345 100,320"
          fill="url(#hairGrad)" opacity="0.4"/>
    <path d="M210,310 C212,340 216,360 222,380 C210,372 202,345 200,320"
          fill="url(#hairGrad)" opacity="0.4"/>

    <!-- ===== BODY / JACKET ===== -->
    <path d="M130,195 C122,210 110,240 105,280 C100,320 98,360 102,400
             L220,400 C224,360 222,320 217,280
             C212,240 200,210 192,195Z"
          fill="url(#jacketGrad)"/>

    <!-- Jacket shoulder pads -->
    <path d="M130,195 C120,198 112,205 108,215 L140,210 L130,195Z"
          fill="#252540" stroke="#FF6EC7" stroke-width="0.8" opacity="0.7"/>
    <path d="M192,195 C202,198 210,205 214,215 L182,210 L192,195Z"
          fill="#252540" stroke="#FF6EC7" stroke-width="0.8" opacity="0.7"/>

    <!-- Jacket collar V-neck neon trim -->
    <path d="M130,195 L148,220 L160,210" fill="none" stroke="#FF6EC7" stroke-width="2.5" filter="url(#neonGlow)"/>
    <path d="M192,195 L174,220 L162,210" fill="none" stroke="#FF6EC7" stroke-width="2.5" filter="url(#neonGlow)"/>

    <!-- Neon vertical strip on jacket center -->
    <line x1="160" y1="220" x2="160" y2="390" stroke="#00FFFF" stroke-width="2" opacity="0.5" filter="url(#neonGlow)"/>

    <!-- Jacket zipper detail -->
    <line x1="161" y1="220" x2="161" y2="390" stroke="#FF6EC7" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>

    <!-- Side neon strips -->
    <line x1="115" y1="240" x2="110" y2="380" stroke="#7B68EE" stroke-width="1.5" opacity="0.4" filter="url(#neonGlow)"/>
    <line x1="207" y1="240" x2="212" y2="380" stroke="#7B68EE" stroke-width="1.5" opacity="0.4" filter="url(#neonGlow)"/>

    <!-- Pocket details -->
    <rect x="125" y="280" width="25" height="3" rx="1" fill="none" stroke="#FF6EC7" stroke-width="0.8" opacity="0.4"/>
    <rect x="172" y="280" width="25" height="3" rx="1" fill="none" stroke="#FF6EC7" stroke-width="0.8" opacity="0.4"/>

    <!-- ===== LEGS ===== -->
    <path d="M120,390 L118,420 L145,420 L148,395Z" fill="url(#bootGrad)"/>
    <path d="M175,395 L178,420 L205,420 L203,390Z" fill="url(#bootGrad)"/>
    <!-- Boot neon trim -->
    <line x1="118" y1="418" x2="145" y2="418" stroke="#00FFFF" stroke-width="1.5" opacity="0.6" filter="url(#neonGlow)"/>
    <line x1="178" y1="418" x2="205" y2="418" stroke="#00FFFF" stroke-width="1.5" opacity="0.6" filter="url(#neonGlow)"/>

    <!-- ===== NECK ===== -->
    <path d="M150,178 C150,185 152,192 160,195 C168,192 170,185 170,178Z"
          fill="url(#skinGrad)"/>

    <!-- ===== HEAD ===== -->
    <ellipse cx="160" cy="145" rx="32" ry="40" fill="url(#skinGrad)"/>

    <!-- Ear left -->
    <ellipse cx="127" cy="148" rx="6" ry="10" fill="url(#skinGrad)"/>
    <!-- Ear cyber implant left -->
    <circle cx="126" cy="145" r="4.5" fill="none" stroke="#00FFFF" stroke-width="1.5" filter="url(#neonGlow)"/>
    <circle cx="126" cy="145" r="2.5" fill="#00FFFF" opacity="0.7"/>
    <circle cx="126" cy="145" r="1" fill="#ffffff" opacity="0.9"/>

    <!-- Ear right -->
    <ellipse cx="193" cy="148" rx="6" ry="10" fill="url(#skinGrad)"/>
    <!-- Ear cyber implant right -->
    <circle cx="194" cy="145" r="4.5" fill="none" stroke="#FF6EC7" stroke-width="1.5" filter="url(#neonGlow)"/>
    <circle cx="194" cy="145" r="2.5" fill="#FF6EC7" opacity="0.7"/>
    <circle cx="194" cy="145" r="1" fill="#ffffff" opacity="0.9"/>

    <!-- ===== HAIR FRONT ===== -->
    <path d="M128,130 C124,105 132,75 160,60 C188,75 196,105 192,130
             C186,118 178,108 168,102 C164,112 156,112 152,102
             C142,108 134,118 128,130Z"
          fill="url(#hairGrad)"/>

    <!-- Hair highlight streak -->
    <path d="M140,95 C145,82 152,72 160,65 C155,78 148,90 142,100"
          fill="url(#hairHighlight)" opacity="0.5"/>

    <!-- Hair side strand left -->
    <path d="M128,130 C120,155 112,200 108,250 C104,280 100,310 95,340
             C105,325 112,290 118,250 C122,220 126,180 128,150"
          fill="url(#hairGrad)" opacity="0.7"/>

    <!-- Hair side strand right -->
    <path d="M192,130 C200,155 208,200 212,250 C216,280 220,310 225,340
             C215,325 208,290 202,250 C198,220 194,180 192,150"
          fill="url(#hairGrad)" opacity="0.7"/>

    <!-- ===== AHOGE (呆毛) ===== -->
    <path d="M160,60 C165,42 172,30 180,22 C175,32 168,45 164,60"
          fill="url(#hairGrad)" filter="url(#hairGlow)"/>
    <!-- Ahoge tip glow -->
    <circle cx="180" cy="22" r="3" fill="#FF6EC7" opacity="0.5" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- ===== CYBER VISOR ===== -->
    <path d="M126,138 C128,128 140,122 160,122 C180,122 192,128 194,138
             C192,146 180,152 160,152 C140,152 128,146 126,138Z"
          fill="url(#visorGrad)" opacity="0.88" filter="url(#neonGlow)"/>

    <!-- Visor frame -->
    <path d="M126,138 C128,128 140,122 160,122 C180,122 192,128 194,138
             C192,146 180,152 160,152 C140,152 128,146 126,138Z"
          fill="none" stroke="#00FFFF" stroke-width="1.5" opacity="0.6"/>

    <!-- Visor shine -->
    <path d="M135,130 C142,127 152,125 165,126" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.45"/>
    <path d="M138,133 C145,131 155,130" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>

    <!-- Eyes glow behind visor -->
    <ellipse cx="148" cy="138" rx="4" ry="3" fill="#00FFFF" opacity="0.9" filter="url(#strongGlow)"/>
    <ellipse cx="172" cy="138" rx="4" ry="3" fill="#00FFFF" opacity="0.9" filter="url(#strongGlow)"/>
    <!-- Eye pupils -->
    <circle cx="149" cy="138" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="173" cy="138" r="2" fill="#ffffff" opacity="0.7"/>

    <!-- ===== NOSE ===== -->
    <path d="M158,150 L160,155 L162,152" fill="none" stroke="#d4a0b8" stroke-width="1" opacity="0.4"/>

    <!-- ===== MOUTH ===== -->
    <path d="M152,162 Q160,168 168,162" fill="none" stroke="#d4a0b8" stroke-width="1.5" opacity="0.5"/>

    <!-- ===== HAND LEFT (holding holographic card) ===== -->
    <g transform="translate(80, 260)">
      <!-- Arm -->
      <path d="M20,0 C15,20 8,50 5,80 C3,95 5,105 10,110
               L25,105 C22,95 20,80 22,60 C24,40 28,20 30,0Z"
            fill="url(#jacketGrad)" opacity="0.9"/>
      <!-- Hand -->
      <path d="M5,80 C-2,90 -8,102 -5,112 C-2,118 6,120 12,116
               C18,110 15,98 10,88Z"
            fill="url(#skinGrad)" opacity="0.95"/>

      <!-- Holographic card -->
      <g filter="url(#neonGlow)">
        <rect x="-30" y="30" width="55" height="38" rx="5" fill="none" stroke="#00FFFF" stroke-width="1.5" opacity="0.7"/>
        <rect x="-30" y="30" width="55" height="38" rx="5" fill="#00FFFF" opacity="0.05"/>
        <!-- Card content lines -->
        <line x1="-22" y1="42" x2="18" y2="42" stroke="#FF6EC7" stroke-width="1.2" opacity="0.6"/>
        <line x1="-22" y1="50" x2="10" y2="50" stroke="#7B68EE" stroke-width="1.2" opacity="0.5"/>
        <line x1="-22" y1="58" x2="15" y2="58" stroke="#00FFFF" stroke-width="1.2" opacity="0.5"/>
        <!-- Card glow dot -->
        <circle cx="20" cy="40" r="3" fill="#00FFFF" opacity="0.6">
          <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- ===== HAND RIGHT (relaxed at side) ===== -->
    <g transform="translate(200, 270)">
      <path d="M0,0 C5,20 10,50 12,80 C13,95 11,105 8,110
               L-5,108 C-2,98 -2,80 0,60 C-1,40 -2,20 0,0Z"
            fill="url(#jacketGrad)" opacity="0.9"/>
      <path d="M12,80 C16,92 18,104 15,112 C12,118 5,118 2,112
               C-1,104 2,92 5,84Z"
            fill="url(#skinGrad)" opacity="0.95"/>
    </g>

    <!-- ===== NEON PARTICLES ===== -->
    <circle cx="90" cy="120" r="3" fill="#FF6EC7" opacity="0.7" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;115;120" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="235" cy="100" r="2.5" fill="#00FFFF" opacity="0.6" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;94;100" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="200" r="2.5" fill="#7B68EE" opacity="0.6" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="75;70;75" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="245" cy="190" r="3" fill="#FF6EC7" opacity="0.5" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="190;183;190" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="50" r="2" fill="#00FFFF" opacity="0.5" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="55" r="2" fill="#FF6EC7" opacity="0.4" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Floating data fragments -->
    <g opacity="0.4" filter="url(#neonGlow)">
      <rect x="60" y="170" width="12" height="8" rx="1" fill="none" stroke="#00FFFF" stroke-width="0.8">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="170;162;170" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="248" y="140" width="10" height="6" rx="1" fill="none" stroke="#FF6EC7" stroke-width="0.8">
        <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="140;133;140" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Perspective grid -->
  <g stroke="url(#gridColor)" stroke-width="1" fill="none">
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="265" x2="1200" y2="265"/>
    <line x1="0" y1="290" x2="1200" y2="290"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="328" x2="1200" y2="328"/>
    <line x1="0" y1="342" x2="1200" y2="342"/>
    <line x1="0" y1="354" x2="1200" y2="354"/>
    <line x1="0" y1="364" x2="1200" y2="364"/>
    <line x1="0" y1="372" x2="1200" y2="372"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="383" x2="1200" y2="383"/>
    <line x1="0" y1="387" x2="1200" y2="387"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="393" x2="1200" y2="393"/>
    <!-- Vertical perspective -->
    <line x1="600" y1="220" x2="0" y2="420"/>
    <line x1="600" y1="220" x2="100" y2="420"/>
    <line x1="600" y1="220" x2="200" y2="420"/>
    <line x1="600" y1="220" x2="300" y2="420"/>
    <line x1="600" y1="220" x2="400" y2="420"/>
    <line x1="600" y1="220" x2="500" y2="420"/>
    <line x1="600" y1="220" x2="600" y2="420"/>
    <line x1="600" y1="220" x2="700" y2="420"/>
    <line x1="600" y1="220" x2="800" y2="420"/>
    <line x1="600" y1="220" x2="900" y2="420"/>
    <line x1="600" y1="220" x2="1000" y2="420"/>
    <line x1="600" y1="220" x2="1100" y2="420"/>
    <line x1="600" y1="220" x2="1200" y2="420"/>
  </g>

  <!-- Horizon glow -->
  <ellipse cx="350" cy="230" rx="300" ry="12" fill="#FF6EC7" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Bottom fade -->
  <rect y="395" width="1200" height="25" fill="#0D1117"/>
</svg>
