<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="gridColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6EC7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF6EC7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7B68EE" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6EC7"/>
      <stop offset="50%" stop-color="#7B68EE"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>
    <linearGradient id="imgOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6EC7" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#7B68EE" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="sideFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="imgGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundedClip">
      <rect x="700" y="30" width="220" height="300" rx="12"/>
    </clipPath>
    <!-- Scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="white" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background sky -->
  <rect width="1200" height="380" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="20" r="1.5"/><circle cx="180" cy="40" r="1"/>
    <circle cx="320" cy="15" r="1.2"/><circle cx="450" cy="35" r="1"/>
    <circle cx="580" cy="10" r="1.5"/><circle cx="720" cy="28" r="1"/>
    <circle cx="860" cy="18" r="1.3"/><circle cx="1000" cy="32" r="1"/>
    <circle cx="1140" cy="22" r="1.1"/><circle cx="100" cy="55" r="0.8"/>
    <circle cx="260" cy="48" r="1"/><circle cx="520" cy="52" r="0.8"/>
    <circle cx="780" cy="45" r="1.2"/><circle cx="950" cy="58" r="0.7"/>
    <circle cx="1080" cy="42" r="0.9"/><circle cx="40" cy="70" r="1"/>
    <circle cx="400" cy="65" r="0.6"/><circle cx="660" cy="60" r="0.9"/>
  </g>

  <!-- Neon sun -->
  <circle cx="350" cy="120" r="70" fill="#FF6EC7" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="350" cy="120" r="48" fill="none" stroke="#FF6EC7" stroke-width="2" opacity="0.35"/>
  <circle cx="350" cy="120" r="38" fill="none" stroke="#7B68EE" stroke-width="1.5" opacity="0.25"/>
  <g stroke="#050510" stroke-width="4">
    <line x1="302" y1="108" x2="398" y2="108"/>
    <line x1="305" y1="120" x2="395" y2="120"/>
    <line x1="310" y1="132" x2="390" y2="132"/>
    <line x1="318" y1="144" x2="382" y2="144"/>
  </g>

  <!-- City silhouette LEFT -->
  <g fill="#08080f">
    <rect x="20" y="100" width="40" height="60"/><rect x="65" y="80" width="25" height="80"/>
    <rect x="95" y="95" width="45" height="65"/><rect x="145" y="70" width="20" height="90"/>
    <rect x="170" y="85" width="30" height="75"/><rect x="205" y="100" width="25" height="60"/>
    <rect x="235" y="75" width="22" height="85"/><rect x="262" y="90" width="18" height="70"/>
    <rect x="285" y="80" width="28" height="80"/><rect x="318" y="105" width="20" height="55"/>
  </g>
  <g fill="#FF6EC7" opacity="0.5">
    <rect x="28" y="108" width="4" height="4"/><rect x="45" y="118" width="4" height="4"/>
    <rect x="72" y="88" width="4" height="4"/><rect x="105" y="102" width="4" height="4"/>
    <rect x="125" y="112" width="4" height="4"/><rect x="152" y="78" width="4" height="4"/>
    <rect x="180" y="92" width="4" height="4"/><rect x="242" y="82" width="4" height="4"/>
    <rect x="295" y="88" width="4" height="4"/>
  </g>

  <!-- City silhouette RIGHT (behind image) -->
  <g fill="#08080f">
    <rect x="950" y="85" width="30" height="75"/><rect x="985" y="70" width="25" height="90"/>
    <rect x="1015" y="90" width="40" height="70"/><rect x="1060" y="60" width="22" height="100"/>
    <rect x="1087" y="78" width="30" height="82"/><rect x="1122" y="95" width="25" height="65"/>
    <rect x="1152" y="75" width="28" height="85"/>
  </g>
  <g fill="#7B68EE" opacity="0.4">
    <rect x="958" y="92" width="4" height="4"/><rect x="995" y="78" width="4" height="4"/>
    <rect x="1025" y="98" width="4" height="4"/><rect x="1068" y="68" width="4" height="4"/>
    <rect x="1095" y="85" width="4" height="4"/><rect x="1160" y="82" width="4" height="4"/>
  </g>

  <!-- ========== ANIME CHARACTER IMAGE ========== -->
  <!-- Glow behind image -->
  <rect x="688" y="18" width="244" height="324" rx="16" fill="#FF6EC7" opacity="0.08" filter="url(#imgGlow)"/>

  <!-- Image container with rounded corners -->
  <g clip-path="url(#roundedClip)">
    <image href="assets/anime-neko-1.jpg" x="700" y="30" width="220" height="300" preserveAspectRatio="xMidYMid slice"/>
    <!-- Cyberpunk color overlay -->
    <rect x="700" y="30" width="220" height="300" fill="url(#imgOverlay)"/>
    <!-- Scanline overlay -->
    <rect x="700" y="30" width="220" height="300" fill="url(#scanlines)"/>
  </g>

  <!-- Neon border around image -->
  <rect x="700" y="30" width="220" height="300" rx="12" fill="none" stroke="url(#neonBorder)" stroke-width="2.5" filter="url(#neonGlow)" opacity="0.8"/>

  <!-- Corner accents -->
  <g stroke="#00FFFF" stroke-width="2" filter="url(#neonGlow)" opacity="0.7">
    <line x1="700" y1="45" x2="700" y2="55"/>
    <line x1="700" y1="45" x2="710" y2="45"/>
    <line x1="920" y1="45" x2="920" y2="55"/>
    <line x1="920" y1="45" x2="910" y2="45"/>
    <line x1="700" y1="315" x2="700" y2="305"/>
    <line x1="700" y1="315" x2="710" y2="315"/>
    <line x1="920" y1="315" x2="920" y2="305"/>
    <line x1="920" y1="315" x2="910" y2="315"/>
  </g>

  <!-- Neon label under image -->
  <text x="810" y="348" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#FF6EC7" opacity="0.7">NEKO://UNIT_01</text>

  <!-- Side fade for blending -->
  <rect x="690" y="0" width="30" height="380" fill="url(#sideFade)" opacity="0.5"/>
  <rect x="920" y="0" width="30" height="380" fill="url(#sideFade)" opacity="0.5"/>

  <!-- Perspective grid -->
  <g stroke="url(#gridColor)" stroke-width="1" fill="none">
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="245" x2="1200" y2="245"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="290" x2="1200" y2="290"/>
    <line x1="0" y1="308" x2="1200" y2="308"/>
    <line x1="0" y1="322" x2="1200" y2="322"/>
    <line x1="0" y1="334" x2="1200" y2="334"/>
    <line x1="0" y1="344" x2="1200" y2="344"/>
    <line x1="0" y1="352" x2="1200" y2="352"/>
    <line x1="0" y1="358" x2="1200" y2="358"/>
    <line x1="0" y1="363" x2="1200" y2="363"/>
    <line x1="0" y1="367" x2="1200" y2="367"/>
    <!-- Vertical perspective -->
    <line x1="600" y1="200" x2="0" y2="380"/>
    <line x1="600" y1="200" x2="100" y2="380"/>
    <line x1="600" y1="200" x2="200" y2="380"/>
    <line x1="600" y1="200" x2="300" y2="380"/>
    <line x1="600" y1="200" x2="400" y2="380"/>
    <line x1="600" y1="200" x2="500" y2="380"/>
    <line x1="600" y1="200" x2="600" y2="380"/>
    <line x1="600" y1="200" x2="700" y2="380"/>
    <line x1="600" y1="200" x2="800" y2="380"/>
    <line x1="600" y1="200" x2="900" y2="380"/>
    <line x1="600" y1="200" x2="1000" y2="380"/>
    <line x1="600" y1="200" x2="1100" y2="380"/>
    <line x1="600" y1="200" x2="1200" y2="380"/>
  </g>

  <!-- Horizon glow -->
  <ellipse cx="350" cy="215" rx="350" ry="12" fill="#FF6EC7" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Bottom fade -->
  <rect y="355" width="1200" height="25" fill="#0D1117"/>
</svg>
